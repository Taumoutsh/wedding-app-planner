version: '3.8'

services:
  wedding-planner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wedding-planner-app
    ports:
      - "6001:3000"
      - "6002:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:./prisma/prod.db
    volumes:
      - ./data:/app/server/prisma
    restart: unless-stopped
    networks:
      - web-network

networks:
  web-network:
    external: true
