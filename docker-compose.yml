services:
  wedding-planner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wedding-planner-app
    ports:
      - "0.0.0.0:6001:3000"
      - "0.0.0.0:6002:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:./prisma/prod.db
    volumes:
      - ./data:/app/server/prisma
    restart: unless-stopped
    networks:
      - wedding-network

networks:
  wedding-network:
    driver: bridge
