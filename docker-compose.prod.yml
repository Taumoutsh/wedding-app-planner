version: '3.8'

services:
  wedding-planner:
    build:
      context: .
      dockerfile: Dockerfile
    image: wedding-planner-app:latest
    container_name: wedding-planner-app

    # Port mapping: internal 6001 exposed
    ports:
      - "127.0.0.1:6001:6001"  # Only listen on localhost for security

    # Environment variables
    environment:
      NODE_ENV: production
      PORT: 6001
      DATABASE_URL: file:./prisma/prod.db
      # Add your JWT_SECRET here or use .env file
      # JWT_SECRET: ${JWT_SECRET}

    # Volume for persistent database
    volumes:
      - ./data:/app/server/prisma
      - ./logs:/app/logs  # Optional: application logs

    # Restart policy
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:6001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits (optional)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.5'
    #       memory: 256M

    # Logging configuration (optional)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Optional: Add nginx service if you want to manage both in docker-compose
# services:
#   nginx:
#     image: nginx:alpine
#     ports:
#       - "80:80"
#       - "443:443"
#     volumes:
#       - ./nginx/wedding-planner.conf:/etc/nginx/conf.d/default.conf
#       - ./ssl:/etc/nginx/ssl  # If using SSL certs
#     depends_on:
#       - wedding-planner
#     restart: unless-stopped

networks:
  default:
    name: wedding-planner-network
